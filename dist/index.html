<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="输入任意关键词，在动态分支图上找灵感，沿着喜欢的想法继续发散。">
  <title>灵感发散器</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./ideas.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="./index.html"><span class="brand-icon" aria-hidden="true">✦</span>灵感发散器</a>
      <button class="quiet-button" type="button" id="open-saved"><span aria-hidden="true">☆</span> 已收藏 <span id="saved-count" class="count" hidden></span></button>
    </div>
  </header>

  <main class="layout">
    <section class="hero" aria-labelledby="title">
      <h1 id="title">从一个词，<br>打开<span>更多可能。</span></h1>
      <div>
        <form id="idea-form" class="search">
          <label class="sr-only" for="keyword">输入关键词或短语</label>
          <input id="keyword" name="keyword" placeholder="输入任意关键词或短语" maxlength="100" required autocomplete="off" enterkeyhint="go">
          <button class="primary" type="submit">开始发散 <span aria-hidden="true">↗</span></button>
        </form>
        <div class="examples" id="examples">
          <span>试试</span>
          <button type="button" data-keyword="咖啡">咖啡</button>
          <button type="button" data-keyword="奶茶">奶茶</button>
          <button type="button" data-keyword="城市漫游">城市漫游</button>
          <button type="button" data-keyword="太空旅行">太空旅行</button>
        </div>
      </div>
    </section>

    <section class="workspace" id="results" aria-label="灵感分支图">
      <div class="workspace-toolbar">
        <nav id="trail" class="trail" aria-label="发散路径" hidden></nav>
        <p id="graph-hint" class="graph-hint">点选分支，查看并继续发散</p>
        <button type="button" id="more" class="quiet-button more"><span aria-hidden="true">⟳</span> 换一批</button>
      </div>

      <div id="plot" class="plot" role="group" aria-labelledby="result-title">
        <div id="connections" class="connections" aria-hidden="true"></div>
        <div class="center">
          <div class="center-copy">
            <span class="center-mark" aria-hidden="true">✦</span>
            <h2 id="result-title" tabindex="-1"></h2>
          </div>
        </div>
        <div id="branches" class="branches"></div>
      </div>

      <section class="idea-detail" id="idea-detail" aria-labelledby="detail-title">
        <div class="detail-copy">
          <div class="detail-heading">
            <span class="detail-category" id="detail-category"></span>
            <h3 id="detail-title"></h3>
          </div>
          <p id="detail-text"></p>
        </div>
        <div class="detail-actions">
          <button class="save" id="save-detail" type="button" aria-pressed="false"></button>
          <button class="primary explore" id="explore-detail" type="button">继续发散 <span aria-hidden="true">↗</span></button>
        </div>
      </section>
      <p id="notice" class="sr-only" role="status"></p>
    </section>
  </main>

  <dialog id="saved-dialog" aria-labelledby="saved-title">
    <div class="dialog-heading">
      <h2 id="saved-title">已收藏的灵感</h2>
      <form method="dialog"><button type="submit" class="close" aria-label="关闭收藏">×</button></form>
    </div>
    <p id="saved-empty" class="saved-empty" hidden>点选分支后，点击详情旁的星星即可收藏。</p>
    <ul id="saved-list" class="saved-list"></ul>
  </dialog>

  <template id="branch-template">
    <button class="branch" type="button" aria-pressed="false" aria-controls="idea-detail">
      <span class="branch-marker" aria-hidden="true"></span>
      <span class="branch-label">
        <span class="branch-category"></span>
        <span class="branch-title"></span>
      </span>
    </button>
  </template>

  <template id="saved-template">
    <li class="saved-item">
      <div class="saved-heading">
        <h3 class="saved-name"></h3>
        <button class="save" type="button" aria-pressed="true"></button>
      </div>
      <p class="saved-topic"></p>
      <p class="saved-description"></p>
      <button class="saved-explore" type="button">继续发散 <span aria-hidden="true">↗</span></button>
    </li>
  </template>
</body>
</html>
