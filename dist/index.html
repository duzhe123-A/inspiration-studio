<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6fb">
  <meta name="description" content="输入任意关键词，在动态分支图上找灵感，沿着喜欢的想法继续发散。">
  <title>灵感发散器</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./ideas.js"></script>
  <script defer src="./followups.js"></script>
  <script defer src="./plan.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="./index.html"><span class="brand-icon" aria-hidden="true">✦</span>灵感发散器</a>
      <button class="quiet-button" type="button" id="open-saved"><span aria-hidden="true">☆</span> 已收藏 <span id="saved-count" class="count" hidden></span></button>
    </div>
  </header>

  <main class="layout">
    <section class="hero" id="keyword-panel" aria-labelledby="title">
      <h1 id="title">从一个词，<br>打开<span>更多可能</span>。</h1>
      <div>
        <div class="search-controls" id="search-controls">
          <form id="idea-form" class="search">
            <label class="sr-only" for="keyword">输入关键词或短语</label>
            <input id="keyword" name="keyword" placeholder="输入关键词或短语" maxlength="100" required autocomplete="off" enterkeyhint="go">
            <button class="primary" type="submit">开始发散 <span aria-hidden="true">↗</span></button>
          </form>
        </div>
        <div class="examples" id="examples">
          <span>试试</span>
          <button type="button" data-keyword="咖啡">咖啡</button>
          <button type="button" data-keyword="奶茶">奶茶</button>
          <button type="button" data-keyword="城市漫游">城市漫游</button>
          <button type="button" data-keyword="太空旅行">太空旅行</button>
        </div>
      </div>
    </section>

    <section class="workspace" id="results" aria-label="灵感分支图">
      <div class="graph-card">
        <div class="workspace-toolbar" id="workspace-toolbar">
          <nav id="trail" class="trail" aria-label="发散路径" hidden></nav>
          <p id="graph-hint" class="graph-hint">点选分支查看灵感</p>
          <div class="graph-actions">
            <button type="button" id="open-map" class="quiet-button">全图</button>
            <button type="button" id="open-plan" class="quiet-button plan-entry">整合方案 <span id="plan-badge" class="count" hidden></span></button>
            <button type="button" id="more" class="quiet-button more"><span aria-hidden="true">⟳</span> 换一批</button>
          </div>
        </div>

        <div id="plot" class="plot" role="group" aria-labelledby="result-title">
          <div id="connections" class="connections" aria-hidden="true"></div>
          <div class="center">
            <div class="center-copy">
              <span class="center-mark" aria-hidden="true">✦</span>
              <h2 id="result-title" tabindex="-1"></h2>
            </div>
          </div>
          <div id="branches" class="branches"></div>
        </div>
      </div>

      <section class="idea-detail" id="idea-detail" aria-labelledby="detail-title">
        <div class="detail-heading">
          <span class="detail-category" id="detail-category"></span>
          <h3 id="detail-title"></h3>
        </div>
        <p class="detail-text" id="detail-text"></p>
        <div class="detail-actions">
          <button class="detail-toggle" id="detail-toggle" type="button" aria-controls="detail-text" aria-expanded="false">
            <span id="detail-toggle-label">展开详情</span><span class="chevron" aria-hidden="true"></span>
          </button>
          <button class="quiet-button copy-idea" id="copy-idea" type="button">复制灵感</button>
          <button class="save" id="save-detail" type="button" aria-pressed="false"></button>
          <button class="primary explore" id="explore-detail" type="button">继续发散 <span aria-hidden="true">↗</span></button>
        </div>
      </section>
      <p id="notice" class="sr-only" role="status"></p>
    </section>
  </main>

  <dialog id="saved-dialog" aria-labelledby="saved-title">
    <div class="dialog-heading">
      <h2 id="saved-title">已收藏的灵感</h2>
      <form method="dialog"><button type="submit" class="close" aria-label="关闭收藏">×</button></form>
    </div>
    <p id="saved-empty" class="saved-empty" hidden>点选分支后，点击详情旁的星星即可收藏。</p>
    <ul id="saved-list" class="saved-list"></ul>
  </dialog>

  <dialog id="map-dialog" class="map-dialog" aria-labelledby="map-title">
    <div class="dialog-heading">
      <h2 id="map-title">灵感全图</h2>
      <form method="dialog"><button type="submit" class="close" aria-label="关闭全图">×</button></form>
    </div>
    <div class="map-scroll">
      <ul id="map-tree" class="map-tree" aria-label="已展开的灵感路径"></ul>
    </div>
  </dialog>

  <dialog id="plan-dialog" class="plan-dialog" aria-labelledby="plan-title">
    <div class="dialog-heading">
      <h2 id="plan-title">整合创意方案</h2>
      <form method="dialog"><button type="submit" class="close" aria-label="关闭创意方案">×</button></form>
    </div>
    <div id="plan-picker">
      <p class="plan-hint">至少选择两条灵感。切换分支后可以接着选。</p>
      <fieldset class="plan-choices">
        <legend class="sr-only">选择要整合的灵感</legend>
        <div id="plan-options"></div>
      </fieldset>
      <div class="plan-actions">
        <span id="plan-count" role="status"></span>
        <button id="generate-plan" class="primary" type="button" disabled>生成方案</button>
      </div>
    </div>
    <div id="plan-result" hidden>
      <article id="plan-content" class="plan-content" tabindex="-1">
        <h3 id="plan-name"></h3>
        <section>
          <h4>核心想法</h4>
          <p id="plan-concept"></p>
        </section>
        <section>
          <h4>具体执行步骤</h4>
          <ol id="plan-steps"></ol>
        </section>
        <section>
          <h4>最终成果</h4>
          <p id="plan-deliverable"></p>
        </section>
      </article>
      <div class="plan-actions">
        <button id="edit-plan" class="quiet-button" type="button">调整选择</button>
        <button id="copy-plan" class="primary" type="button">复制方案</button>
        <span id="plan-status" class="sr-only" role="status"></span>
      </div>
    </div>
  </dialog>

  <dialog id="copy-dialog" aria-labelledby="copy-title">
    <div class="dialog-heading">
      <h2 id="copy-title">复制灵感</h2>
      <form method="dialog"><button type="submit" class="close" aria-label="关闭复制">×</button></form>
    </div>
    <p class="copy-instructions">请复制下方已选中的文字。</p>
    <textarea id="copy-text" aria-label="灵感内容" readonly rows="7"></textarea>
  </dialog>

  <template id="branch-template">
    <button class="branch" type="button" aria-pressed="false" aria-controls="idea-detail">
      <span class="branch-marker" aria-hidden="true"></span>
      <span class="branch-label">
        <span class="branch-category"></span>
        <span class="branch-title"></span>
      </span>
    </button>
  </template>

  <template id="saved-template">
    <li class="saved-item">
      <div class="saved-heading">
        <h3 class="saved-name"></h3>
        <button class="save" type="button" aria-pressed="true"></button>
      </div>
      <p class="saved-topic"></p>
      <p class="saved-description"></p>
      <button class="saved-explore" type="button">继续发散 <span aria-hidden="true">↗</span></button>
    </li>
  </template>
</body>
</html>
